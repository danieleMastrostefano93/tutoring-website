name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:release
      - run: npm run test:notifications
      - name: Validate production configuration
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
        run: |
          test -n "$FIREBASE_API_KEY"
          test "$PRIVACY_URL" = "/privacy/"
      - run: npm run build
        env:
          PUBLIC_BACKEND: firebase
          PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: tutor-website-717e5.firebaseapp.com
          PUBLIC_FIREBASE_PROJECT_ID: tutor-website-717e5
          PUBLIC_FIREBASE_APP_ID: 1:870834974460:web:bce395908569695b33b179
          SITE_URL: https://tutor-website-717e5.web.app
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TUTOR_WEBSITE_717E5 }}
          channelId: live
          projectId: tutor-website-717e5
